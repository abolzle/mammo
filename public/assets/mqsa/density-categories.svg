<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="t d">
  <title id="t">Four MQSA report density categories</title>
  <desc id="d">Four boxes from left to right, shaded from lightest to darkest, labeled: almost entirely fatty; scattered areas of fibroglandular density; heterogeneously dense; extremely dense. Shading is symbolic, not image data.</desc>
  <rect width="640" height="200" fill="#fbfaf7"/>
  <g font-family="sans-serif" font-size="13" fill="#0f172a" text-anchor="middle">
    <rect x="20" y="30" width="135" height="100" rx="8" fill="#e2e8f0" stroke="#334155"/>
    <text x="87" y="155">Almost entirely</text><text x="87" y="172">fatty</text>
    <rect x="175" y="30" width="135" height="100" rx="8" fill="#b6c2d1" stroke="#334155"/>
    <text x="242" y="155">Scattered areas of</text><text x="242" y="172">fibroglandular density</text>
    <rect x="330" y="30" width="135" height="100" rx="8" fill="#7d8ea5" stroke="#334155"/>
    <text x="397" y="155">Heterogeneously</text><text x="397" y="172">dense</text>
    <rect x="485" y="30" width="135" height="100" rx="8" fill="#475569" stroke="#334155"/>
    <text x="552" y="155">Extremely</text><text x="552" y="172">dense</text>
  </g>
  <text x="630" y="194" fill="#475569" font-size="10" font-family="sans-serif" text-anchor="end">SYMBOLIC SHADING — NOT IMAGE DATA</text>
</svg>
