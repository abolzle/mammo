<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d">
  <title id="t">Schematic MLO outline for label placement</title>
  <desc id="d">Simplified line drawing of a mediolateral oblique view: chest wall on the left, a triangular pectoral muscle band at upper left, and the breast contour curving to the nipple at right. Not a mammogram.</desc>
  <rect x="0" y="0" width="400" height="300" fill="#0f1b2d"/>
  <path d="M30 0 L130 0 L30 190 Z" fill="#3b4b63"/>
  <path d="M30 0 C 160 10, 330 120, 330 190 C 330 240, 200 290, 30 296 Z" fill="#6b7a90" opacity="0.85"/>
  <path d="M30 40 C 140 70, 250 140, 300 190" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M30 120 C 140 140, 230 170, 290 205" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="331" cy="192" r="5" fill="#cbd5e1"/>
  <text x="392" y="292" fill="#e2e8f0" font-size="12" font-family="sans-serif" text-anchor="end">SCHEMATIC — NOT A MAMMOGRAM</text>
</svg>
