<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Schematic of imaging information systems: RIS and EHR on the left, the mammography unit in the center, PACS archive and interpretation display on the right, with arrows showing orders flowing to the unit and images flowing to PACS.">
  <rect width="640" height="300" fill="#F7F5F1"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6475"/></marker></defs>
  <text x="24" y="32" font-family="Georgia, serif" font-size="18" fill="#1B2A41">Where orders, images, and reports travel</text>
  <rect x="24" y="56" width="150" height="90" rx="6" fill="#EEF0F3" stroke="#5A6475" stroke-width="2"/>
  <text x="36" y="84" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1B2A41">RIS</text>
  <text x="36" y="108" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">Schedule and track</text>
  <text x="36" y="126" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">radiology exams</text>
  <rect x="24" y="170" width="150" height="90" rx="6" fill="#EEF0F3" stroke="#5A6475" stroke-width="2"/>
  <text x="36" y="198" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1B2A41">HIS / EHR</text>
  <text x="36" y="222" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">Hospital record;</text>
  <text x="36" y="240" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">chart across providers</text>
  <rect x="214" y="110" width="170" height="100" rx="6" fill="#EEF0F3" stroke="#5A6475" stroke-width="2"/>
  <text x="226" y="138" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1B2A41">Mammography unit</text>
  <text x="226" y="162" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">Acquisition</text>
  <text x="226" y="180" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">workstation</text>
  <rect x="424" y="56" width="192" height="100" rx="6" fill="#E3F2F1" stroke="#0F6E6E" stroke-width="2"/>
  <text x="436" y="84" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1B2A41">PACS archive</text>
  <text x="436" y="108" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">Storage and</text>
  <text x="436" y="126" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">communication</text>
  <rect x="424" y="180" width="192" height="90" rx="6" fill="#E3F2F1" stroke="#0F6E6E" stroke-width="2"/>
  <text x="436" y="208" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1B2A41">Interpretation display</text>
  <text x="436" y="232" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">Review and processing</text>
  <line x1="174" y1="110" x2="212" y2="140" stroke="#5A6475" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="384" y1="140" x2="422" y2="110" stroke="#5A6475" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="520" y1="156" x2="520" y2="178" stroke="#5A6475" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="424" y1="230" x2="176" y2="220" stroke="#5A6475" stroke-width="2" marker-end="url(#ah)"/>
  <text x="24" y="292" font-family="system-ui,sans-serif" font-size="11" fill="#5A6475">Schematic only. Arrows are a simplified teaching flow, not a vendor architecture.</text>
</svg>
