<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Three boxes naming HIPAA contingency plan elements: data backup plan, disaster recovery plan, and emergency mode operation plan.">
  <rect width="640" height="260" fill="#F7F5F1"/>
  <text x="24" y="32" font-family="Georgia, serif" font-size="18" fill="#1B2A41">HIPAA contingency plan: three required elements</text>
  <rect x="24" y="60" width="184" height="140" rx="6" fill="#E3F2F1" stroke="#0F6E6E" stroke-width="2"/>
  <text x="36" y="88" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1B2A41">Data backup plan</text>
  <text x="36" y="112" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">45 CFR 164.308</text>
  <text x="36" y="130" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">(a)(7)(ii)(A)</text>
  <rect x="228" y="60" width="184" height="140" rx="6" fill="#E3F2F1" stroke="#0F6E6E" stroke-width="2"/>
  <text x="240" y="88" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1B2A41">Disaster recovery</text>
  <text x="240" y="112" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">45 CFR 164.308</text>
  <text x="240" y="130" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">(a)(7)(ii)(B)</text>
  <rect x="432" y="60" width="184" height="140" rx="6" fill="#E3F2F1" stroke="#0F6E6E" stroke-width="2"/>
  <text x="444" y="88" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1B2A41">Emergency mode</text>
  <text x="444" y="112" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">45 CFR 164.308</text>
  <text x="444" y="130" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">(a)(7)(ii)(C)</text>
  <text x="24" y="240" font-family="system-ui,sans-serif" font-size="11" fill="#5A6475">Schematic only. Your facility's plan defines who does what.</text>
</svg>
