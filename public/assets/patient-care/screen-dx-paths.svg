<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="t d">
  <title id="t">Screening versus diagnostic mammography paths</title>
  <desc id="d">Two schematic paths. Left: asymptomatic patient with routine views labeled screening. Right: symptoms or abnormal screening with individualized views labeled diagnostic.</desc>
  <rect width="640" height="280" fill="#fbfaf7"/>
  <rect x="20" y="40" width="280" height="200" rx="8" fill="#e7f3f1" stroke="#0f766e" stroke-width="2"/>
  <rect x="340" y="40" width="280" height="200" rx="8" fill="#f3efe7" stroke="#1e293b" stroke-width="2"/>
  <g font-family="Georgia, serif" fill="#1e293b" text-anchor="middle">
    <text x="160" y="78" font-size="20" font-weight="700">Screening</text>
    <text x="480" y="78" font-size="20" font-weight="700">Diagnostic</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="14" fill="#334155" text-anchor="middle">
    <text x="160" y="120">Asymptomatic patient</text>
    <text x="160" y="145">Routine views</text>
    <text x="160" y="180">Look for cancer</text>
    <text x="160" y="205">before symptoms</text>
    <text x="480" y="120">Symptoms, signs, or</text>
    <text x="480" y="145">abnormal screening</text>
    <text x="480" y="180">Individualized views</text>
    <text x="480" y="205">Often more angles</text>
  </g>
</svg>
