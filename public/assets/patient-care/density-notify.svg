<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="t d">
  <title id="t">Dense versus not-dense notification mapping</title>
  <desc id="d">Four schematic boxes from fatty to extremely dense. First two labeled not dense; last two labeled dense.</desc>
  <rect width="640" height="220" fill="#fbfaf7"/>
  <g font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">
    <rect x="16" y="30" width="140" height="120" fill="#f8f1e3" stroke="#1e293b"/>
    <text x="86" y="70" fill="#1e293b">Almost entirely</text>
    <text x="86" y="88" fill="#1e293b">fatty</text>
    <text x="86" y="175" fill="#0f766e" font-size="13">Not dense</text>
    <rect x="172" y="30" width="140" height="120" fill="#e7d9b8" stroke="#1e293b"/>
    <text x="242" y="70" fill="#1e293b">Scattered</text>
    <text x="242" y="88" fill="#1e293b">fibroglandular</text>
    <text x="242" y="175" fill="#0f766e" font-size="13">Not dense</text>
    <rect x="328" y="30" width="140" height="120" fill="#c8b089" stroke="#1e293b"/>
    <text x="398" y="70" fill="#1e293b">Heterogeneously</text>
    <text x="398" y="88" fill="#1e293b">dense</text>
    <text x="398" y="175" fill="#9a3412" font-size="13">Dense</text>
    <rect x="484" y="30" width="140" height="120" fill="#8b7355" stroke="#1e293b"/>
    <text x="554" y="70" fill="#fbfaf7">Extremely</text>
    <text x="554" y="88" fill="#fbfaf7">dense</text>
    <text x="554" y="175" fill="#9a3412" font-size="13">Dense</text>
  </g>
  <text x="320" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Schematic shading only — not a mammogram</text>
</svg>
