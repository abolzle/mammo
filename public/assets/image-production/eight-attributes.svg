<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="t d">
  <title id="t">Eight clinical image quality attributes</title>
  <desc id="d">Eight boxes: positioning, compression, exposure level, contrast, sharpness, noise, artifacts, examination identification.</desc>
  <rect width="640" height="240" fill="#fbfaf7"/>
  <text x="320" y="24" fill="#1e3a5f" font-size="14" font-family="system-ui,sans-serif" text-anchor="middle">Clinical image review attributes</text>
<rect x="20" y="45" width="145" height="75" rx="8" fill="#ffffff" stroke="#2f6f73"/><text x="92" y="88" fill="#134e4a" font-size="12" font-family="system-ui,sans-serif" text-anchor="middle">Positioning</text><rect x="175" y="45" width="145" height="75" rx="8" fill="#ffffff" stroke="#2f6f73"/><text x="247" y="88" fill="#134e4a" font-size="12" font-family="system-ui,sans-serif" text-anchor="middle">Compression</text><rect x="330" y="45" width="145" height="75" rx="8" fill="#ffffff" stroke="#2f6f73"/><text x="402" y="88" fill="#134e4a" font-size="12" font-family="system-ui,sans-serif" text-anchor="middle">Exposure level</text><rect x="485" y="45" width="145" height="75" rx="8" fill="#ffffff" stroke="#2f6f73"/><text x="557" y="88" fill="#134e4a" font-size="12" font-family="system-ui,sans-serif" text-anchor="middle">Contrast</text><rect x="20" y="135" width="145" height="75" rx="8" fill="#ffffff" stroke="#2f6f73"/><text x="92" y="178" fill="#134e4a" font-size="12" font-family="system-ui,sans-serif" text-anchor="middle">Sharpness</text><rect x="175" y="135" width="145" height="75" rx="8" fill="#ffffff" stroke="#2f6f73"/><text x="247" y="178" fill="#134e4a" font-size="12" font-family="system-ui,sans-serif" text-anchor="middle">Noise</text><rect x="330" y="135" width="145" height="75" rx="8" fill="#ffffff" stroke="#2f6f73"/><text x="402" y="178" fill="#134e4a" font-size="12" font-family="system-ui,sans-serif" text-anchor="middle">Artifacts</text><rect x="485" y="135" width="145" height="75" rx="8" fill="#ffffff" stroke="#2f6f73"/><text x="557" y="178" fill="#134e4a" font-size="12" font-family="system-ui,sans-serif" text-anchor="middle">Exam ID</text>
