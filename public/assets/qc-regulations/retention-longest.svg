<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Medical record retention chooses the longest applicable period">
  <rect width="640" height="260" fill="#F7F5F1"/>
  <text x="24" y="34" font-family="Georgia, serif" font-size="18" fill="#1B2A41">Retention: keep the longest rule</text>
  <rect x="40" y="70" width="160" height="110" rx="4" fill="#FFF" stroke="#1B2A41" stroke-width="1.5"/>
  <text x="60" y="110" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#2A6F6A">5 yr</text>
  <text x="60" y="140" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">Minimum federal</text>
  <text x="60" y="158" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">floor</text>
  <rect x="240" y="70" width="160" height="110" rx="4" fill="#FFF" stroke="#1B2A41" stroke-width="1.5"/>
  <text x="255" y="110" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#2A6F6A">10 yr</text>
  <text x="255" y="140" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">If no later mammo</text>
  <text x="255" y="158" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">at this facility</text>
  <rect x="440" y="70" width="160" height="110" rx="4" fill="#E8F3F1" stroke="#2A6F6A" stroke-width="2"/>
  <text x="455" y="110" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#2A6F6A">State+</text>
  <text x="455" y="140" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">Any longer State</text>
  <text x="455" y="158" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">or local mandate</text>
  <text x="24" y="220" font-family="system-ui,sans-serif" font-size="13" fill="#1B2A41">Original mammograms and reports stay for the longest of these three.</text>
</svg>
