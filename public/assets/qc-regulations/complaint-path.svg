<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Consumer complaint path from facility to accreditation body">
  <rect width="640" height="260" fill="#F7F5F1"/>
  <text x="24" y="34" font-family="Georgia, serif" font-size="18" fill="#1B2A41">Serious consumer complaint path</text>
  <rect x="24" y="60" width="160" height="100" rx="4" fill="#FFF" stroke="#1B2A41" stroke-width="1.5"/>
  <text x="40" y="95" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1B2A41">1. Facility</text>
  <text x="40" y="118" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">Written system</text>
  <text x="40" y="138" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">Try to resolve</text>
  <path d="M190 110 H230" stroke="#2A6F6A" stroke-width="2" marker-end="url(#a)"/>
  <rect x="236" y="60" width="168" height="100" rx="4" fill="#FFF" stroke="#1B2A41" stroke-width="1.5"/>
  <text x="252" y="95" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1B2A41">2. If unresolved</text>
  <text x="252" y="118" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">Directions to file</text>
  <text x="252" y="138" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">with accreditation body</text>
  <path d="M410 110 H450" stroke="#2A6F6A" stroke-width="2"/>
  <rect x="456" y="60" width="160" height="100" rx="4" fill="#E8F3F1" stroke="#2A6F6A" stroke-width="2"/>
  <text x="472" y="95" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1B2A41">3. Accreditation</text>
  <text x="472" y="118" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">body receives report</text>
  <text x="472" y="138" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">of unresolved cases</text>
  <text x="24" y="210" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">Facility keeps each serious complaint record at least 3 years from receipt.</text>
  <text x="24" y="232" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">A consumer may be the patient or a representative (family or referring clinician).</text>
</svg>
