  <text x="40" y="108" font-family="system-ui,sans-serif" font-size="11" fill="#1B2A41">Laterally exaggerated CC</text>
  <rect x="230" y="50" width="180" height="90" rx="4" fill="#FFF8E8" stroke="#8A6A20" stroke-width="2"/>
  <text x="248" y="85" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1B2A41">Cleavage</text>
