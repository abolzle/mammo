<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Schematic Universal Protocol three steps">
  <rect width="640" height="280" fill="#F7F5F1"/>
  <text x="24" y="30" font-family="Georgia, serif" font-size="16" fill="#1B2A41">Universal Protocol (AHRQ summary) — schematic</text>
  <rect x="30" y="70" width="170" height="140" rx="4" fill="#E8F0FF" stroke="#2F5D8C" stroke-width="2"/>
  <text x="48" y="110" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1B2A41">1. Verification</text>
  <text x="48" y="140" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">Includes signed</text>
  <text x="48" y="158" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">consent review</text>
  <rect x="235" y="70" width="170" height="140" rx="4" fill="#FFF8E8" stroke="#8A6A20" stroke-width="2"/>
  <text x="255" y="110" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1B2A41">2. Site marking</text>
  <text x="255" y="140" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">Mark operative</text>
  <text x="255" y="158" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">site / side</text>
  <rect x="440" y="70" width="170" height="140" rx="4" fill="#EAF7EE" stroke="#2F6B45" stroke-width="2"/>
  <text x="460" y="110" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1B2A41">3. Time-out</text>
  <text x="460" y="140" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">Just before</text>
  <text x="460" y="158" font-family="system-ui,sans-serif" font-size="12" fill="#1B2A41">procedure starts</text>
  <text x="24" y="250" font-family="system-ui,sans-serif" font-size="11" fill="#5A6472">SCHEMATIC — NOT A PROCEDURE PHOTO · Joint Commission text not redistributed</text>
</svg>
