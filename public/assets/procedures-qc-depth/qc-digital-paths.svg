<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Schematic digital QC paths under dose ceiling">
  <rect width="640" height="280" fill="#F4F7F5"/>
  <text x="24" y="28" font-family="Georgia, serif" font-size="16" fill="#1B2A41">Digital mammography QC paths (schematic)</text>
  <rect x="160" y="20" width="320" height="36" rx="4" fill="#E8F0FF" stroke="#2F5D8C" stroke-width="2"/>
  <text x="200" y="44" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1B2A41">3.0 mGy phantom dose ceiling (both paths)</text>
  <rect x="40" y="80" width="240" height="140" rx="4" fill="#FFF8E8" stroke="#8A6A20" stroke-width="2"/>
  <text x="60" y="115" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1B2A41">Path A</text>
  <text x="60" y="145" font-family="system-ui,sans-serif" font-size="13" fill="#1B2A41">Manufacturer-recommended</text>
  <text x="60" y="165" font-family="system-ui,sans-serif" font-size="13" fill="#1B2A41">QA program (§ 900.12(e)(6))</text>
  <rect x="360" y="80" width="240" height="140" rx="4" fill="#EAF7EE" stroke="#2F6B45" stroke-width="2"/>
  <text x="380" y="115" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1B2A41">Path B — Alt #24</text>
  <text x="380" y="145" font-family="system-ui,sans-serif" font-size="13" fill="#1B2A41">ACR DMQC Manual + DBT</text>
  <text x="380" y="165" font-family="system-ui,sans-serif" font-size="13" fill="#1B2A41">Supplement (link-only procedures)</text>
  <text x="24" y="255" font-family="system-ui,sans-serif" font-size="11" fill="#5A6472">SCHEMATIC — NOT A MAMMOGRAM · ACR worksheets not shown</text>
</svg>
