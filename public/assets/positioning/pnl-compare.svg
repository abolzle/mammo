<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d">
  <title id="t">Schematic PNL comparison between CC and MLO</title>
  <desc id="d">Side-by-side schematic CC and MLO with posterior nipple line segments drawn. Not a mammogram.</desc>
  <rect width="640" height="300" fill="#0f1b2d"/>
  <text x="20" y="28" fill="#5eead4" font-size="14" font-family="ui-sans-serif,system-ui,sans-serif">PNL comparison (schematic)</text>
  <!-- CC -->
  <text x="40" y="55" fill="#94a3b8" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">CC</text>
  <path d="M40 70 V230" stroke="#94a3b8" stroke-width="2"/>
  <path d="M40 80 C 130 65, 220 90, 250 150 C 220 210, 130 235, 40 220 Z" fill="#6b7a90" opacity="0.85"/>
  <circle cx="250" cy="150" r="5" fill="#e2e8f0"/>
  <line x1="250" y1="150" x2="40" y2="150" stroke="#fbbf24" stroke-width="3"/>
  <text x="110" y="142" fill="#fbbf24" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">CC PNL</text>
  <!-- MLO -->
  <text x="360" y="55" fill="#94a3b8" font-size="13" font-family="ui-sans-serif,system-ui,sans-serif">MLO</text>
  <path d="M360 60 L455 60 L375 200 Z" fill="#3b4b63"/>
  <path d="M360 60 C 470 75, 560 140, 575 185 C 555 235, 470 270, 360 275 Z" fill="#6b7a90" opacity="0.85"/>
  <circle cx="575" cy="185" r="5" fill="#e2e8f0"/>
  <line x1="575" y1="185" x2="400" y2="120" stroke="#fbbf24" stroke-width="3"/>
  <text x="455" y="140" fill="#fbbf24" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">MLO PNL</text>
  <text x="620" y="288" fill="#e2e8f0" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="end">SCHEMATIC — NOT A MAMMOGRAM</text>
</svg>
