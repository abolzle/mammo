<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="t d">
  <title id="t">Schematic implant in-field versus displacement</title>
  <desc id="d">Two side-view schematics comparing implant overlapping tissue versus implant displaced posteriorly. Not a mammogram.</desc>
  <rect width="640" height="280" fill="#0f1b2d"/>
  <text x="180" y="24" fill="#5eead4" font-size="14" font-family="ui-sans-serif,system-ui,sans-serif">Implant schematic (not a mammogram)</text>
  <!-- left -->
  <rect x="30" y="45" width="260" height="185" rx="8" fill="#172554" stroke="#334155"/>
  <text x="160" y="68" fill="#94a3b8" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">In-field implant</text>
  <ellipse cx="160" cy="150" rx="70" ry="55" fill="#64748b"/>
  <ellipse cx="160" cy="150" rx="40" ry="32" fill="#94a3b8"/>
  <text x="160" y="155" fill="#0f172a" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">implant</text>
  <!-- right -->
  <rect x="350" y="45" width="260" height="185" rx="8" fill="#172554" stroke="#334155"/>
  <text x="480" y="68" fill="#94a3b8" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">Displacement</text>
  <ellipse cx="520" cy="155" rx="36" ry="30" fill="#94a3b8"/>
  <path d="M390 110 C 430 90, 470 95, 500 130 C 470 175, 420 185, 390 170 Z" fill="#64748b"/>
  <text x="430" y="145" fill="#e2e8f0" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif">tissue</text>
  <text x="520" y="160" fill="#0f172a" font-size="10" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">implant</text>
  <text x="320" y="260" fill="#e2e8f0" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">SCHEMATIC — NOT A MAMMOGRAM</text>
</svg>
