<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" role="img" aria-labelledby="t d">
  <title id="t">Schematic mediolateral oblique outline</title>
  <desc id="d">Simplified MLO outline with a convex pectoral muscle band at upper left and nipple at right. Not a mammogram.</desc>
  <rect width="420" height="320" fill="#0f1b2d"/>
  <text x="16" y="28" fill="#5eead4" font-size="14" font-family="ui-sans-serif,system-ui,sans-serif">MLO (schematic)</text>
  <path d="M30 8 L140 8 L48 200 Z" fill="#3b4b63"/>
  <path d="M30 8 C 170 20, 320 120, 340 190 C 320 250, 190 300, 30 305 Z" fill="#6b7a90" opacity="0.88"/>
  <path d="M48 20 C 90 70, 110 130, 95 190" stroke="#5eead4" stroke-width="3" fill="none"/>
  <circle cx="340" cy="190" r="6" fill="#e2e8f0"/>
  <text x="52" y="70" fill="#cbd5e1" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">pectoralis</text>
  <text x="348" y="194" fill="#cbd5e1" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">nipple</text>
  <text x="404" y="308" fill="#e2e8f0" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="end">SCHEMATIC — NOT A MAMMOGRAM</text>
</svg>
